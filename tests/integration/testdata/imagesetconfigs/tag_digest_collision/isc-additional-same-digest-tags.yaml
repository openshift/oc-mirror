# ImageSetConfig for the INVERSE of the tag+digest cache collision (OCPBUGS-105878).
#
# Both entries reference the SAME repository AND digest but under two DIFFERENT tags via
# the "repo:tag@sha256:..." form. Because the local cache is keyed by digest, both share a
# single content-addressed cache entry (stored/archived once). diskToMirror must recreate
# BOTH human tags at the destination, each pointing to that one digest.
#
# This needs no operator catalog - it uses the digest of a test image directly. The tags
# themselves need not exist at the source since the image is pulled by digest.
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  additionalImages:
  - name: localhost:5001/oc-mirror/oc-mirror-dev:same-digest-a@{{ digest "oc-mirror/oc-mirror-dev:operand" }}
  - name: localhost:5001/oc-mirror/oc-mirror-dev:same-digest-b@{{ digest "oc-mirror/oc-mirror-dev:operand" }}
