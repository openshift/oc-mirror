# ImageSetConfig whose blocked pattern matches every collected image, including the
# operator catalog, so there is nothing left to mirror.
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  operators:
  - catalog: quay.io/oc-mirror/oc-mirror-dev:test-catalog-latest
    packages:
    - name: baz
  additionalImages:
  - name: quay.io/oc-mirror/oc-mirror-dev:foo-bundle-v0.2.0
  blockedImages:
  - name: ".*"
