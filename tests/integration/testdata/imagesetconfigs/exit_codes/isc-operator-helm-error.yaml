kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  operators:
    - catalog: registry.invalid.example.com/nonexistent/catalog:v4.20
      packages:
        - name: nonexistent-operator
  additionalImages:
    - name: localhost:5001/unsigned/docker-manifest-list@{{ digest "unsigned/docker-manifest-list:latest" }}
  helm:
    local:
      - name: nonexistent-chart
        path: /nonexistent/path/to/chart
