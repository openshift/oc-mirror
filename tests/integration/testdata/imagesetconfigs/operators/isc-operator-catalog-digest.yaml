# ImageSetConfig to test mirroring with a digest-pinned catalog reference
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  operators:
    - catalog: localhost:5001/oc-mirror/oc-mirror-dev@{{ digest "oc-mirror/oc-mirror-dev:test-catalog-latest" }}
      packages:
      - name: foo
        defaultChannel: beta
        channels:
        - name: beta
          minVersion: '0.3.1'
          maxVersion: '0.3.1'
