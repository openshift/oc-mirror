# ImageSetConfig to test mirroring with a digest-pinned catalog reference
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  operators:
    - catalog: ${ORIGIN_REGISTRY}/oc-mirror/oc-mirror-dev@${DIGEST:oc-mirror/oc-mirror-dev:test-catalog}
      packages:
      - name: foo
        defaultChannel: beta
        channels:
        - name: beta
          minVersion: '0.3.1'
          maxVersion: '0.3.1'
