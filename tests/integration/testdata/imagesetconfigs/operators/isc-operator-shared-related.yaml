# Mirror multiple foo versions that share the same related operator image.
# Used with disc-operator-shared-related.yaml to verify delete does not remove
# related images still referenced by a sibling version (OCPBUGS-61236).
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  operators:
    - catalog: quay.io/oc-mirror/oc-mirror-dev:test-catalog-latest
      packages:
      - name: foo
        defaultChannel: beta
        channels:
        - name: beta
          minVersion: '0.2.0'
          maxVersion: '0.3.1'
