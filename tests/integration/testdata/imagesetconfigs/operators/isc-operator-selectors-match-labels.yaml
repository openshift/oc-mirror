# ImageSetConfig to test selecting the related images to mirror with matchLabels (CLID-717):
# only the related images without labels and the ones labelled feature=analytics are mirrored
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  operators:
    - catalog: quay.io/oc-mirror/oc-mirror-dev:test-catalog-labels
      packages:
      - name: foo
        selectors:
        - matchLabels:
            feature: analytics
