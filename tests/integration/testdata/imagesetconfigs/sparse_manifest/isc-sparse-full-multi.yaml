kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  platform:
    graph: false
    release: localhost:5001/oc-mirror/release/test-release-index-multi:v0.0.1
    platforms:
      - os: linux
        architecture: amd64
      - os: linux
        architecture: arm64
  additionalImages:
    - name: localhost:5001/oc-mirror/multi-platform-image:latest
      platforms:
        - os: linux
          architecture: amd64
        - os: linux
          architecture: arm64
    - name: localhost:5001/oc-mirror/single-manifest-image:latest
  operators:
    - catalog: localhost:5001/oc-mirror/oc-mirror-dev:test-catalog-multi
      packages:
        - name: foo
        - name: bar
      platforms:
        - os: linux
          architecture: amd64
  helm:
    repositories:
      - name: test-chart
        url: http://localhost:5002
        charts:
          - name: test-chart
            version: 1.0.0
            platforms:
              - os: linux
                architecture: amd64
