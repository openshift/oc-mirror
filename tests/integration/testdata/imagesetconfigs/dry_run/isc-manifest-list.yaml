# ImageSetConfig to test dry-run mapping of a manifest list (multi-arch) additional image.
# unsigned/docker-manifest-list (pinned by digest) is a manifest list with two
# platform-specific sub-manifests (arm64, ppc64le), used to verify that
# dry-run mapping.txt includes an entry for each sub-digest (OCPBUGS-66263).
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  additionalImages:
  - name: localhost:5001/unsigned/docker-manifest-list@{{ digest "unsigned/docker-manifest-list:latest" }}
