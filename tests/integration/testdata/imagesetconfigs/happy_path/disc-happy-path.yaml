# DeleteImageSetConfig to test basic functionality of oc-mirror
# It uses a dummy release and operator catalog, and a light helm chart and additional image
kind: DeleteImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
delete:
  platform:
    graph: false 
    release: localhost:5001/oc-mirror/release/test-release-index:v0.0.1
  helm:
    repositories:
    - name: test-chart
      url: http://localhost:5002
      charts:
      - name: test-chart
        version: 1.0.0
  additionalImages:
  # Referenced by tag, not by digest: in mirrorToMirror, oc-mirror mistakes digest-only
  # references from a registry with a port (localhost:5001/...@sha256:...) for tag+digest
  # references (ImageSpec.IsImageByTagAndDigest), and fails. Switch back to the digest
  # once that bug is fixed.
  - name: localhost:5001/unsigned/docker-manifest-list:latest
  operators:
  - catalog: localhost:5001/oc-mirror/oc-mirror-dev:test-catalog-latest
    packages:
    - name: foo
    - name: bar
    - name: baz
