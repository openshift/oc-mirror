# Both containers reference the SAME repository and tag
# (oc-mirror-dev:shared-operand) but pin two DIFFERENT digests, via the
# "repo:tag@sha256:..." form. This reproduces, for helm-referenced images, the
# same tag+digest cache collision covered for additionalImages and operator
# related images in tests/integration/tag_digest_collision_test.go.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tag-digest-collision
spec:
  template:
    spec:
      initContainers:
      - name: init
        image: localhost:5001/oc-mirror/oc-mirror-dev:shared-operand@{{ digest "oc-mirror/oc-mirror-dev:operand-alt" }}
      containers:
      - name: main
        image: localhost:5001/oc-mirror/oc-mirror-dev:shared-operand@{{ digest "oc-mirror/oc-mirror-dev:operand" }}
